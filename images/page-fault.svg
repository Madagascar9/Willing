<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img"><title>Request Page 4: it is not currently in memory</title><rect width="900" height="350" rx="20" fill="#15151a"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="450" y="37" fill="#f8fafc" font-size="21">Request Page 4: it is not currently in memory</text><text x="155" y="78" fill="#fbbf24" font-size="17">1. Check</text><rect x="25" y="94" width="260" height="43" rx="8" fill="#252033" stroke="#a78bfa"/><text x="155" y="122" fill="#f8fafc" font-size="18">CPU requests Page 4</text><rect x="25" y="149" width="260" height="43" rx="8" fill="#252033" stroke="#a78bfa"/><text x="155" y="177" fill="#f8fafc" font-size="18">Page table: not resident</text><rect x="25" y="204" width="260" height="43" rx="8" fill="#252033" stroke="#a78bfa"/><text x="155" y="232" fill="#f8fafc" font-size="18">Page fault → OS handles</text><text x="303" y="185" fill="#a78bfa" font-size="24">→</text><text x="450" y="78" fill="#fbbf24" font-size="17">2. Make room</text><rect x="320" y="94" width="260" height="43" rx="8" fill="#252033" stroke="#a78bfa"/><text x="450" y="122" fill="#f8fafc" font-size="18">Memory is full</text><rect x="320" y="149" width="260" height="43" rx="8" fill="#252033" stroke="#a78bfa"/><text x="450" y="177" fill="#f8fafc" font-size="18">Select a victim page</text><rect x="320" y="204" width="260" height="43" rx="8" fill="#252033" stroke="#a78bfa"/><text x="450" y="232" fill="#f8fafc" font-size="18">Load Page 4 into frame</text><text x="598" y="185" fill="#a78bfa" font-size="24">→</text><text x="745" y="78" fill="#fbbf24" font-size="17">3. Continue</text><rect x="615" y="94" width="260" height="43" rx="8" fill="#252033" stroke="#a78bfa"/><text x="745" y="122" fill="#f8fafc" font-size="18">Update page table</text><rect x="615" y="149" width="260" height="43" rx="8" fill="#252033" stroke="#a78bfa"/><text x="745" y="177" fill="#f8fafc" font-size="18">Restart the instruction</text><rect x="615" y="204" width="260" height="43" rx="8" fill="#252033" stroke="#a78bfa"/><text x="745" y="232" fill="#f8fafc" font-size="18">Page 4 is now resident</text><text x="450" y="330" fill="#a6b0c3" font-size="16">A fault needs replacement only when no usable empty frame is available.</text></g></svg>
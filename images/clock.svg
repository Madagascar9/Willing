<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img"><title>Clock gives a second chance before replacing a page</title><rect width="900" height="350" rx="20" fill="#15151a"/><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#f8fafc"><text x="450" y="38" font-size="22">Request Page 4 · Hand starts at Frame 0</text><g fill="#252033" stroke="#a78bfa"><rect x="30" y="90" width="250" height="160" rx="15"/><rect x="325" y="90" width="250" height="160" rx="15"/><rect x="620" y="90" width="250" height="160" rx="15"/></g><g font-size="19"><text x="155" y="125" fill="#fbbf24">1. Frame 0 · Page 1</text><text x="155" y="170">Bit 1 → clear to 0</text><text x="155" y="210">Skip: second chance</text><text x="450" y="125" fill="#fbbf24">2. Frame 1 · Page 2</text><text x="450" y="170">Bit 0 → replace</text><text x="450" y="210">Load Page 4, bit = 1</text><text x="745" y="125" fill="#fbbf24">3. Frame 2 · Page 3</text><text x="745" y="170">Hand now points here</text><text x="745" y="210">Page and bit unchanged</text><text x="302" y="180">→</text><text x="597" y="180">→</text><text x="450" y="300" fill="#a6b0c3">Circular scan: after Frame 2, the next position is Frame 0.</text></g></g></svg>

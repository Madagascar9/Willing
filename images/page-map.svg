<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img"><title>A page number tells us which frame to use</title><rect width="900" height="350" rx="20" fill="#15151a"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="450" y="37" fill="#f8fafc" font-size="21">A page number tells us which frame to use</text><text x="155" y="78" fill="#fbbf24" font-size="17">Virtual pages</text><rect x="25" y="94" width="260" height="43" rx="8" fill="#252033" stroke="#a78bfa"/><text x="155" y="122" fill="#f8fafc" font-size="18">Page 0</text><rect x="25" y="149" width="260" height="43" rx="8" fill="#252033" stroke="#a78bfa"/><text x="155" y="177" fill="#f8fafc" font-size="18">Page 1</text><rect x="25" y="204" width="260" height="43" rx="8" fill="#252033" stroke="#a78bfa"/><text x="155" y="232" fill="#f8fafc" font-size="18">Page 2</text><text x="303" y="185" fill="#a78bfa" font-size="24">→</text><text x="450" y="78" fill="#fbbf24" font-size="17">Page table</text><rect x="320" y="94" width="260" height="43" rx="8" fill="#252033" stroke="#a78bfa"/><text x="450" y="122" fill="#f8fafc" font-size="18">Page 0 → Frame 2</text><rect x="320" y="149" width="260" height="43" rx="8" fill="#252033" stroke="#a78bfa"/><text x="450" y="177" fill="#f8fafc" font-size="18">Page 1 → Not resident</text><rect x="320" y="204" width="260" height="43" rx="8" fill="#252033" stroke="#a78bfa"/><text x="450" y="232" fill="#f8fafc" font-size="18">Page 2 → Frame 0</text><text x="598" y="185" fill="#a78bfa" font-size="24">→</text><text x="745" y="78" fill="#fbbf24" font-size="17">Physical memory</text><rect x="615" y="94" width="260" height="43" rx="8" fill="#252033" stroke="#a78bfa"/><text x="745" y="122" fill="#f8fafc" font-size="18">Frame 0: Page 2</text><rect x="615" y="149" width="260" height="43" rx="8" fill="#252033" stroke="#a78bfa"/><text x="745" y="177" fill="#f8fafc" font-size="18">Frame 1: Empty</text><rect x="615" y="204" width="260" height="43" rx="8" fill="#252033" stroke="#a78bfa"/><text x="745" y="232" fill="#f8fafc" font-size="18">Frame 2: Page 0</text><text x="450" y="330" fill="#a6b0c3" font-size="16">Follow Page 0 across: its data is in Frame 2, not necessarily Frame 0.</text></g></svg>